<style>
/* Layout: one phone-width column, the list is the spine, scan + add pinned in the thumb zone */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --line: #D2D8D5;
  --fg: #17201C;
  --muted: #5A6761;
  --accent: #22385A;
  --accent-fg: #FFFFFF;
  --accent-soft: #DCE4EF;
  --scrim: rgba(12, 18, 16, 0.48);
  --cam-bg: #000000;
  --cam-fg: #FFFFFF;
  --cam-dim: rgba(0, 0, 0, 0.55);
  --st-exp: #B3261E; --st-exp-bg: #FBE2DF;
  --st-now: #B04F0A; --st-now-bg: #FDE6D3;
  --st-plan: #8A6100; --st-plan-bg: #FAEFCB;
  --st-ok: #2B6B39; --st-ok-bg: #DCEFDF;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-print: "DotGothic16", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1412; --surface: #171E1B; --line: #2E3934;
    --fg: #E6EBE8; --muted: #98A69F; --accent: #9FB9DF; --accent-fg: #0E1828; --accent-soft: #1E2B3F;
    --scrim: rgba(0, 0, 0, 0.6);
    --st-exp: #FF8F85; --st-exp-bg: #3B1714;
    --st-now: #FFB27A; --st-now-bg: #3A2312;
    --st-plan: #EFCB66; --st-plan-bg: #322A0F;
    --st-ok: #8ED29A; --st-ok-bg: #14301B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1412; --surface: #171E1B; --line: #2E3934;
  --fg: #E6EBE8; --muted: #98A69F; --accent: #9FB9DF; --accent-fg: #0E1828; --accent-soft: #1E2B3F;
  --scrim: rgba(0, 0, 0, 0.6);
  --st-exp: #FF8F85; --st-exp-bg: #3B1714;
  --st-now: #FFB27A; --st-now-bg: #3A2312;
  --st-plan: #EFCB66; --st-plan-bg: #322A0F;
  --st-ok: #8ED29A; --st-ok-bg: #14301B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 18px calc(116px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 18px;
}

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1; letter-spacing: 0.01em; }
.top .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.btn-quiet {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn-quiet:disabled { opacity: 0.55; cursor: default; }

.banner { border: 1px solid var(--st-plan); background: var(--st-plan-bg); border-radius: var(--radius); padding: 10px 12px; font-size: 0.92rem; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 400px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 10px 9px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.tile .n { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 0.8rem; color: var(--muted); line-height: 1.2; }
.tile[data-st="exp"] .n { color: var(--st-exp); }
.tile[data-st="now"] .n { color: var(--st-now); }
.tile[data-st="plan"] .n { color: var(--st-plan); }
.tile[data-st="ok"] .n { color: var(--st-ok); }
.tile.zero .n { color: var(--muted); opacity: 0.6; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.facts { display: grid; gap: 8px; }
.fact { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; font-size: 0.95rem; }
.fact .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.fact .v { min-width: 0; }
.fact .v b { font-weight: 600; }
.fact.due .v { color: var(--st-now); font-weight: 600; }

.list-head { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 0 12px; font-size: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { width: 100%; display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 10px 0; cursor: pointer; overflow: hidden; }
.row .bar { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--st-ok); }
.row[data-st="exp"] .bar { background: var(--st-exp); }
.row[data-st="now"] .bar { background: var(--st-now); }
.row[data-st="plan"] .bar { background: var(--st-plan); }
.row .name { display: block; font-weight: 600; font-size: 1.02rem; line-height: 1.25; overflow-wrap: anywhere; }
.row .meta { display: block; color: var(--muted); font-size: 0.84rem; margin-top: 2px; overflow-wrap: anywhere; }
.row .when { text-align: right; display: grid; justify-items: end; gap: 3px; }
.row .date { font-family: var(--font-print); font-size: 0.98rem; letter-spacing: 0.04em; white-space: nowrap; }
.pill { font-size: 0.74rem; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: 999px; white-space: nowrap; background: var(--st-ok-bg); color: var(--st-ok); }
.pill[data-st="exp"] { background: var(--st-exp-bg); color: var(--st-exp); }
.pill[data-st="now"] { background: var(--st-now-bg); color: var(--st-now); }
.pill[data-st="plan"] { background: var(--st-plan-bg); color: var(--st-plan); }
.qty { font-family: var(--font-display); font-weight: 600; color: var(--fg); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px 16px; text-align: center; color: var(--muted); }
.empty b { color: var(--fg); display: block; margin-bottom: 4px; }

.actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.actionbar .inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 1rem; cursor: pointer; text-align: center; -webkit-user-select: none; user-select: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--st-exp); border-color: var(--st-exp); background: transparent; }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn svg { width: 22px; height: 22px; flex: none; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet .scrim { position: absolute; inset: 0; background: var(--scrim); }
.panel { position: relative; width: 100%; max-width: 680px; max-height: 90dvh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; transform: translateY(16px); opacity: 0; transition: transform 160ms ease-out, opacity 160ms ease-out; }
.sheet.open .panel { transform: none; opacity: 1; }
@media (min-width: 720px) { .sheet { align-items: center; } .panel { border-radius: 16px; } }
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.panel p { margin: 0; }
.panel .lead { color: var(--muted); }
.code { font-family: var(--font-print); letter-spacing: 0.06em; overflow-wrap: anywhere; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > span, .legend { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.field input, .field select { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 12px; font-size: 16px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 40px; font-weight: 600; font-size: 0.92rem; cursor: pointer; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-fg); }
.hint { font-size: 0.85rem; color: var(--muted); }
.err { color: var(--st-exp); font-weight: 600; font-size: 0.92rem; }
.stack { display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mini li { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.choices { display: grid; gap: 8px; }
.choices .btn { justify-content: space-between; text-align: left; font-weight: 500; }
.choices .tag { font-size: 0.75rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
.found { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 2px; }
.found .fname { font-weight: 600; font-size: 1.1rem; }
.found .fmeta { color: var(--muted); font-size: 0.88rem; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px 0; justify-self: center; }
.menu { display: grid; gap: 8px; }
.menu .btn { justify-content: flex-start; }

/* Live scanner */
.scanner { position: fixed; inset: 0; z-index: 50; background: var(--cam-bg); color: var(--cam-fg); }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanner .guide {
  position: absolute; left: 50%; top: 45%;
  width: min(84vw, 520px); height: min(30vh, 220px);
  transform: translate(-50%, -50%);
  border-radius: 14px;
  box-shadow: 0 0 0 100vmax var(--cam-dim);
  outline: 3px solid var(--cam-fg);
}
.scanner .guide::after { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--st-exp); opacity: 0.85; animation: sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(60px); } }
@media (prefers-reduced-motion: reduce) { .scanner .guide::after { animation: none; } }
.scanner.hit .guide { outline-color: var(--st-ok); }
.scan-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px; text-align: center; font-weight: 600; font-size: 1.05rem; }
.scan-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.scan-bottom button { min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--cam-fg); background: var(--cam-dim); color: var(--cam-fg); font-weight: 600; cursor: pointer; }
.scan-bottom button[aria-pressed="true"] { background: var(--cam-fg); color: var(--cam-bg); }
.scan-msg { position: absolute; left: 16px; right: 16px; top: 45%; transform: translateY(-50%); text-align: center; font-size: 1.05rem; line-height: 1.4; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 999px; font-size: 0.92rem; font-weight: 500; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Noodpakket</h1>
      <p class="sub" id="sub">Voorraad laden…</p>
    </div>
    <button class="btn-quiet" id="menuBtn" type="button">Meer</button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="tiles" id="tiles" aria-label="Status van de voorraad">
    <button class="tile" type="button" data-st="exp" aria-pressed="false"><span class="n">–</span><span class="l">Verlopen</span></button>
    <button class="tile" type="button" data-st="now" aria-pressed="false"><span class="n">–</span><span class="l">Nu opmaken</span></button>
    <button class="tile" type="button" data-st="plan" aria-pressed="false"><span class="n">–</span><span class="l">Vervangen plannen</span></button>
    <button class="tile" type="button" data-st="ok" aria-pressed="false"><span class="n">–</span><span class="l">In orde</span></button>
  </section>

  <section class="facts">
    <div class="fact"><span class="k">Eerst aan de beurt</span><span class="v" id="nextUp">–</span></div>
    <div class="fact" id="checkRow"><span class="k">Controle</span><span class="v" id="checkText">–</span><button class="btn-quiet" id="checkBtn" type="button">Vandaag gecontroleerd</button></div>
  </section>

  <section class="stack" aria-label="Producten">
    <div class="list-head">
      <input class="search" id="search" type="search" placeholder="Zoek product" aria-label="Zoek product" autocomplete="off">
      <button class="chip" id="filterChip" type="button" hidden></button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>
</div>

<nav class="actionbar" aria-label="Toevoegen">
  <div class="inner">
    <button class="btn primary" type="button" id="scanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
      Scan barcode
    </button>
    <button class="btn" id="manualBtn" type="button">+ Handmatig</button>
  </div>
</nav>

<div class="scanner" id="scanner" hidden role="dialog" aria-modal="true" aria-label="Barcode scannen">
  <video id="video" playsinline muted autoplay></video>
  <div class="guide" id="guide" aria-hidden="true"></div>
  <div class="scan-top" id="scanTop">Houd de streepjescode in het kader</div>
  <p class="scan-msg" id="scanMsg" hidden></p>
  <div class="scan-bottom">
    <button type="button" id="torchBtn" aria-pressed="false" hidden>Lamp</button>
    <button type="button" id="typeCodeBtn">Cijfers intikken</button>
    <button type="button" id="closeScanBtn">Sluiten</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input id="restoreInput" type="file" accept="application/json,.json" hidden>
<datalist id="dl-names"></datalist>
<datalist id="dl-locs"></datalist>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(() => {
  "use strict";

  // ---------- constants ----------
  const STORE_KEY = "noodpakket.v1";
  const CATS = ["Water/drinken", "Groente", "Fruit", "Soep", "Maaltijd", "Vlees/vis", "Overig"];
  const PACKS = ["Blik", "Pot", "Fles", "Pak", "Zak", "Doos", "Overig"];
  const T_NOW = 90, T_PLAN = 180, CHECK_DAYS = 182, DAY = 86400000;
  const ST_LABEL = { exp: "Verlopen", now: "Nu opmaken", plan: "Vervangen plannen", ok: "In orde" };

  // Startlijst: de 11 producten uit de foto's van 10-10-2026
  const SEED = [
    ["Appelmoes", "Fruit", "Pot", "2028-01-01", false, ""],
    ["Tomatensoep (gebonden, met soepballetjes)", "Soep", "Blik", "2028-04-30", true, ""],
    ["Groentesoep (helder, met soepballen)", "Soep", "Blik", "2028-06-30", true, "Er waren 2 foto's van: heb je 2 blikken, zet Aantal op 2"],
    ["Knakworst mager", "Vlees/vis", "Blik", "2028-06-30", true, ""],
    ["Doperwten en wortelen", "Groente", "Blik", "2028-07-31", false, "Print slecht leesbaar (2028 of 2029?): even nakijken"],
    ["Maïskorrels", "Groente", "Blik", "2028-08-02", false, "Datum deels onder het treklipje: even nakijken"],
    ["Champignonragout", "Maaltijd", "Blik", "2028-11-30", true, ""],
    ["Knakworst mager", "Vlees/vis", "Blik", "2028-12-31", true, ""],
    ["Knakworst mager", "Vlees/vis", "Blik", "2029-01-31", true, ""],
    ["Doperwten en wortelen", "Groente", "Blik", "2029-07-31", false, ""],
    ["Fruitcocktail op lichte siroop", "Fruit", "Blik", "2029-12-31", false, "Laatste cijfer deels onder het treklipje: even nakijken"],
  ];

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  function todayISO() { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; }
  function toUTC(iso) { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); }
  function daysLeft(iso) { return Math.round((toUTC(iso) - toUTC(todayISO())) / DAY); }
  function addDays(iso, n) { const t = new Date(toUTC(iso) + n * DAY); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; }
  function endOfMonth(ym) { const [y, m] = ym.split("-").map(Number); return `${y}-${pad(m)}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`; }
  function fmtDate(iso, monthOnly) { if (!iso) return "geen datum"; const [y, m, d] = iso.split("-"); return monthOnly ? `${m}-${y}` : `${d}-${m}-${y}`; }
  function statusOf(days) { if (days === null) return "ok"; if (days < 0) return "exp"; if (days <= T_NOW) return "now"; if (days <= T_PLAN) return "plan"; return "ok"; }
  function daysText(days) {
    if (days === null) return "geen datum";
    if (days < 0) return days === -1 ? "1 dag verlopen" : `${-days} dagen verlopen`;
    if (days === 0) return "verloopt vandaag";
    if (days <= 60) return days === 1 ? "nog 1 dag" : `nog ${days} dagen`;
    return `nog ${Math.round(days / 30.44)} mnd`;
  }
  const isISO = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  function cleanCode(raw) { return String(raw || "").trim().replace(/\s+/g, "").replace(/[^A-Za-z0-9_.~:@+-]/g, "_").slice(0, 100); }
  function titleCase(s) { s = String(s || "").trim(); return s && s === s.toUpperCase() ? s.charAt(0) + s.slice(1).toLowerCase() : s; }
  function normText(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").trim(); }
  function similarity(a, b) {
    const ca = normText(a).replace(/ /g, ""), cb = normText(b).replace(/ /g, "");
    if (ca && cb && (ca === cb || (Math.min(ca.length, cb.length) >= 5 && (ca.includes(cb) || cb.includes(ca))))) return 1;
    const A = Array.from(new Set(normText(a).split(/\s+/).filter((w) => w.length > 2)));
    const B = Array.from(new Set(normText(b).split(/\s+/).filter((w) => w.length > 2)));
    if (!A.length || !B.length) return 0;
    const match = (x, y) => x === y || (Math.min(x.length, y.length) >= 4 && (x.startsWith(y) || y.startsWith(x)));
    let shared = 0; for (const w of A) if (B.some((v) => match(w, v))) shared++;
    return shared / Math.min(A.length, B.length);
  }

  // ---------- Open Food Facts ----------
  function mapCategory(tags) {
    const t = (tags || []).join(" ").toLowerCase();
    if (/waters|beverages|drinks|juices/.test(t)) return "Water/drinken";
    if (/soups/.test(t)) return "Soep";
    if (/meals|prepared-|ragout/.test(t)) return "Maaltijd";
    if (/meats|sausages|fishes|seafood|poultry/.test(t)) return "Vlees/vis";
    if (/fruits|compotes|applesauces|fruit-/.test(t)) return "Fruit";
    if (/vegetables|legumes|corn|peas|beans|mushrooms/.test(t)) return "Groente";
    return "Overig";
  }
  function mapPack(list) {
    const t = (list || []).join(" ").toLowerCase();
    if (/\b(can|cans|tin|tins|blik)\b|metal|aluminium|steel/.test(t)) return "Blik";
    if (/\b(jar|jars|pot|bocal)\b|glass/.test(t)) return "Pot";
    if (/bottle|fles/.test(t)) return "Fles";
    if (/carton|brick|tetra/.test(t)) return "Pak";
    if (/\b(bag|pouch|zak|sachet)\b/.test(t)) return "Zak";
    if (/\b(box|doos)\b/.test(t)) return "Doos";
    return null;
  }
  function parseOFF(json) {
    if (!json || json.status !== 1 || !json.product) return null;
    const p = json.product;
    const name = String(p.product_name_nl || p.product_name || p.generic_name_nl || "").trim();
    if (!name) return null;
    const tags = p.categories_tags || [];
    const pack = mapPack([...(p.packaging_tags || []), String(p.packaging || "")]) || (tags.some((x) => /canned/.test(x)) ? "Blik" : "Blik");
    return {
      name: name.slice(0, 120),
      brand: titleCase(String(p.brands || "").split(",")[0]).slice(0, 60),
      quantity: String(p.quantity || "").slice(0, 30),
      category: mapCategory(tags),
      pack,
    };
  }
  async function lookupOFF(code) {
    if (!/^\d{8,14}$/.test(code) || !navigator.onLine) return null;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 7000);
    try {
      const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_nl,generic_name_nl,brands,quantity,categories_tags,packaging_tags,packaging`;
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) return null;
      return parseOFF(await r.json());
    } catch (e) { return null; }
    finally { clearTimeout(timer); }
  }

  // GS1 2D codes can carry the expiry date: (01) product number, (17) YYMMDD
  function parseCode(raw) {
    const t = String(raw || "").replace(/^\][A-Za-z]\d/, "");
    let code = t, tht = null, monthOnly = false;
    const m = t.match(/^01(\d{14})/);
    if (m) {
      code = m[1].startsWith("0") ? m[1].slice(1) : m[1];
      const d = t.slice(16).match(/(?:^|\x1d)17(\d{2})(\d{2})(\d{2})/);
      if (d) {
        const y = 2000 + Number(d[1]), mo = Number(d[2]), day = Number(d[3]);
        if (mo >= 1 && mo <= 12) {
          if (day === 0) { tht = endOfMonth(`${y}-${pad(mo)}`); monthOnly = true; }
          else tht = `${y}-${pad(mo)}-${pad(day)}`;
        }
      }
    }
    return { code: cleanCode(code) || "onbekend", tht, monthOnly };
  }

  // ---------- state + storage (on this device) ----------
  let state = { items: [], products: {}, meta: {} };
  let filter = null, query = "", lastFocus = null;

  function normItem(d) {
    d = d || {};
    const q = Number(d.qty);
    return {
      id: typeof d.id === "string" && d.id ? d.id.slice(0, 80) : newId(),
      name: String(d.name || "Naamloos").slice(0, 120),
      brand: String(d.brand || "").slice(0, 60),
      category: CATS.includes(d.category) ? d.category : "Overig",
      pack: PACKS.includes(d.pack) ? d.pack : "Overig",
      qty: Number.isFinite(q) && q >= 0 ? Math.floor(q) : 1,
      tht: isISO(d.tht) ? d.tht : null,
      monthOnly: !!d.monthOnly,
      barcode: typeof d.barcode === "string" ? cleanCode(d.barcode) : "",
      location: String(d.location || "").slice(0, 60),
      note: String(d.note || "").slice(0, 300),
      added: isISO(d.added) ? d.added : "",
    };
  }
  function normState(s) {
    s = s && typeof s === "object" ? s : {};
    const products = {};
    if (s.products && typeof s.products === "object") {
      for (const [k, p] of Object.entries(s.products)) {
        if (!p || !p.name) continue;
        products[cleanCode(k)] = { name: String(p.name).slice(0, 120), brand: String(p.brand || "").slice(0, 60), category: CATS.includes(p.category) ? p.category : "Overig", pack: PACKS.includes(p.pack) ? p.pack : "Overig" };
      }
    }
    return {
      items: Array.isArray(s.items) ? s.items.map(normItem) : [],
      products,
      meta: { lastCheck: s.meta && isISO(s.meta.lastCheck) ? s.meta.lastCheck : null },
    };
  }
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; showBanner("Deze browser laat de app niets bewaren. Open de app in Safari of Chrome, niet in een privévenster."); }
    if (raw) { try { state = normState(JSON.parse(raw)); return; } catch (e) { /* fall through to seed */ } }
    state = normState({
      items: SEED.map(([name, category, pack, tht, monthOnly, note]) => ({ name, category, pack, qty: 1, tht, monthOnly, note, location: "Noodpakket", added: "2026-10-10" })),
      products: {},
      meta: { lastCheck: "2026-10-10" },
    });
    save();
  }
  let persistAsked = false;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { showBanner("Opslaan lukte niet op dit apparaat. Maak via Meer een back-up."); }
    if (!persistAsked && navigator.storage && navigator.storage.persist) { persistAsked = true; navigator.storage.persist().catch(() => {}); }
  }
  function commit() { save(); render(); }
  function showBanner(msg) { const b = $("#banner"); b.textContent = msg; b.hidden = false; }

  // ---------- rendering ----------
  function enrich(i) { const days = i.tht ? daysLeft(i.tht) : null; return { ...i, days, st: statusOf(days) }; }
  function sortItems(list) {
    return list.slice().sort((a, b) => {
      if (a.tht && b.tht && a.tht !== b.tht) return a.tht < b.tht ? -1 : 1;
      if (!a.tht !== !b.tht) return a.tht ? -1 : 1;
      return a.name.localeCompare(b.name, "nl");
    });
  }
  function render() {
    const all = sortItems(state.items.map(enrich));
    const counts = { exp: 0, now: 0, plan: 0, ok: 0 };
    let total = 0;
    for (const i of all) { counts[i.st] += i.qty; total += i.qty; }
    $("#sub").textContent = `Voorraad · ${total} ${total === 1 ? "product" : "producten"}`;

    for (const t of $$(".tile")) {
      const st = t.dataset.st;
      $(".n", t).textContent = String(counts[st]);
      t.classList.toggle("zero", counts[st] === 0);
      t.setAttribute("aria-pressed", String(filter === st));
    }

    const first = all.find((i) => i.tht && i.qty > 0);
    $("#nextUp").innerHTML = first
      ? `<b>${esc(first.name)}</b> · <span class="code">${esc(fmtDate(first.tht, first.monthOnly))}</span> (${esc(daysText(first.days))})`
      : "–";

    const last = state.meta.lastCheck;
    if (last) {
      const next = addDays(last, CHECK_DAYS);
      $("#checkText").innerHTML = `Laatst <span class="code">${esc(fmtDate(last))}</span> · volgende <span class="code">${esc(fmtDate(next))}</span>`;
      $("#checkRow").classList.toggle("due", daysLeft(next) <= 0);
    } else {
      $("#checkText").textContent = "Nog niet vastgelegd";
      $("#checkRow").classList.remove("due");
    }

    const chip = $("#filterChip");
    if (filter) { chip.hidden = false; chip.textContent = `${ST_LABEL[filter]} ✕`; chip.setAttribute("aria-label", `Filter ${ST_LABEL[filter]} wissen`); }
    else chip.hidden = true;

    const q = normText(query);
    const shown = all.filter((i) => (!filter || i.st === filter) && (!q || normText(i.name + " " + i.brand).includes(q) || i.barcode.includes(q)));
    $("#list").innerHTML = shown.map((i) => `
      <li><button class="row" type="button" data-id="${esc(i.id)}" data-st="${i.st}">
        <span class="bar" aria-hidden="true"></span>
        <span>
          <span class="name">${esc(i.name)}</span>
          <span class="meta"><span class="qty">${i.qty}×</span> ${esc(i.pack.toLowerCase())} · ${esc(i.category)}${i.brand ? " · " + esc(i.brand) : ""}${i.location ? " · " + esc(i.location) : ""}</span>
        </span>
        <span class="when">
          <span class="date">${esc(fmtDate(i.tht, i.monthOnly))}</span>
          <span class="pill" data-st="${i.st}">${esc(daysText(i.days))}</span>
        </span>
      </button></li>`).join("");

    const empty = $("#empty");
    if (!state.items.length) { empty.hidden = false; empty.innerHTML = "<b>Nog geen producten</b>Tik op <i>Scan barcode</i> en richt je camera op een blik, of voeg er een handmatig toe."; }
    else if (!shown.length) { empty.hidden = false; empty.innerHTML = "<b>Niets gevonden</b>Pas je zoekterm of filter aan."; }
    else empty.hidden = true;

    const names = new Set(state.items.map((i) => i.name));
    Object.values(state.products).forEach((p) => names.add(p.name));
    $("#dl-names").innerHTML = Array.from(names).sort((a, b) => a.localeCompare(b, "nl")).map((n) => `<option value="${esc(n)}"></option>`).join("");
    const locs = new Set(["Noodpakket", "Voorraadkast", ...state.items.map((i) => i.location).filter(Boolean)]);
    $("#dl-locs").innerHTML = Array.from(locs).map((n) => `<option value="${esc(n)}"></option>`).join("");
  }

  // ---------- toast + sheet ----------
  let toastTimer = null;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }
  function openSheet(html, mount) {
    const sheet = $("#sheet"), panel = $("#panel");
    if (sheet.hidden) lastFocus = document.activeElement;
    panel.innerHTML = html;
    sheet.hidden = false;
    requestAnimationFrame(() => sheet.classList.add("open"));
    if (mount) mount(panel);
    const f = panel.querySelector("[data-focus]") || panel.querySelector("button, input, select");
    if (f && f.focus) setTimeout(() => f.focus({ preventScroll: true }), 30);
  }
  function closeSheet() {
    const sheet = $("#sheet");
    sheet.classList.remove("open"); sheet.hidden = true; $("#panel").innerHTML = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $("#sheet").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#scanner").hidden) scanner.close();
    else if (!$("#sheet").hidden) closeSheet();
  });

  // ---------- product helpers ----------
  function productFor(code) {
    if (!code) return null;
    const p = state.products[code];
    if (p) return p;
    const it = state.items.find((i) => i.barcode === code);
    return it ? { name: it.name, brand: it.brand, category: it.category, pack: it.pack } : null;
  }
  function productByName(name) {
    const n = String(name || "").trim().toLowerCase(); if (!n) return null;
    const it = state.items.find((i) => i.name.toLowerCase() === n);
    if (it) return { name: it.name, brand: it.brand, category: it.category, pack: it.pack, barcode: it.barcode };
    for (const [code, p] of Object.entries(state.products)) if (p.name.toLowerCase() === n) return { ...p, barcode: code };
    return null;
  }
  function linkBarcode(code, p, exceptId) {
    state.products[code] = { name: p.name, brand: p.brand || "", category: p.category, pack: p.pack };
    const n = p.name.toLowerCase();
    for (const i of state.items) if (!i.barcode && i.name.toLowerCase() === n && i.id !== exceptId) { i.barcode = code; if (!i.brand && p.brand) i.brand = p.brand; }
  }
  function useOne(it) {
    if (it.qty > 1) { it.qty -= 1; toast(`${it.name}: nog ${it.qty} over`); }
    else { state.items = state.items.filter((x) => x.id !== it.id); toast(`${it.name} afgestreept`); }
    commit();
  }

  // ---------- add / edit form ----------
  function formHTML(v, editing, fromScan) {
    const opt = (list, cur) => list.map((x) => `<option${x === cur ? " selected" : ""}>${esc(x)}</option>`).join("");
    const month = v.tht ? v.tht.slice(0, 7) : "";
    return `
      <h2 id="sheetTitle">${editing ? "Product bewerken" : "Product toevoegen"}</h2>
      <form id="itemForm" class="stack" novalidate>
        <div class="fields">
          <label class="field full"><span>Product</span>
            <input id="f-name" list="dl-names" autocomplete="off" value="${esc(v.name || "")}" placeholder="Bijv. Knakworst mager"></label>
          <label class="field"><span>Categorie</span><select id="f-cat">${opt(CATS, v.category || "Overig")}</select></label>
          <label class="field"><span>Verpakking</span><select id="f-pack">${opt(PACKS, v.pack || "Blik")}</select></label>
          <div class="field full">
            <span class="legend" id="tht-legend">Houdbaar tot</span>
            <div class="seg" role="radiogroup" aria-labelledby="tht-legend">
              <button type="button" role="radio" data-mode="day" aria-checked="${v.monthOnly ? "false" : "true"}">Dag-maand-jaar</button>
              <button type="button" role="radio" data-mode="month" aria-checked="${v.monthOnly ? "true" : "false"}">Alleen maand/jaar</button>
            </div>
            <input id="f-date" type="date" aria-label="Houdbaar tot (datum)" value="${esc(v.monthOnly ? "" : v.tht || "")}" ${v.monthOnly ? "hidden" : ""} ${v.name && !v.tht ? "data-focus" : ""}>
            <input id="f-month" type="month" aria-label="Houdbaar tot (maand)" value="${esc(v.monthOnly ? month : "")}" ${v.monthOnly ? "" : "hidden"}>
            <span class="hint" id="month-hint" ${v.monthOnly ? "" : "hidden"}>Staat er alleen een maand op het blik? Dan rekent de app met de laatste dag van die maand.</span>
          </div>
          <label class="field"><span>Aantal</span><input id="f-qty" type="number" inputmode="numeric" min="1" step="1" value="${esc(v.qty || 1)}"></label>
          <label class="field"><span>Locatie</span><input id="f-loc" list="dl-locs" autocomplete="off" value="${esc(v.location || "Noodpakket")}"></label>
          <label class="field"><span>Merk</span><input id="f-brand" autocomplete="off" value="${esc(v.brand || "")}" placeholder="Optioneel"></label>
          <label class="field"><span>Barcode</span><input id="f-code" inputmode="numeric" autocomplete="off" value="${esc(v.barcode || "")}" placeholder="Via scannen"></label>
          <label class="field full"><span>Opmerking</span><input id="f-note" autocomplete="off" value="${esc(v.note || "")}" placeholder="Optioneel"></label>
        </div>
        <p class="err" id="formErr" role="alert" hidden></p>
        <button class="btn primary" type="submit" id="saveBtn">${editing ? "Opslaan" : "Toevoegen"}</button>
        ${!editing && fromScan ? `<button class="btn" type="submit" id="saveNextBtn">Toevoegen en volgende scannen</button>` : ""}
        ${editing ? `<div class="two">
          <button class="btn" type="button" id="useBtn">Eentje opgebruikt</button>
          <button class="btn danger" type="button" id="delBtn">Verwijderen</button>
        </div>` : ""}
        <button class="linkbtn" type="button" data-close>Annuleren</button>
      </form>`;
  }

  function openForm(values, editingId, fromScan) {
    const v = { location: "Noodpakket", qty: 1, pack: "Blik", ...values };
    openSheet(formHTML(v, !!editingId, fromScan), (root) => {
      let mode = v.monthOnly ? "month" : "day";
      let touchedCat = !!editingId || !!values.category, touchedPack = !!editingId || !!values.pack;
      let scanNext = false;
      const setMode = (m) => {
        mode = m;
        $$("[data-mode]", root).forEach((b) => b.setAttribute("aria-checked", String(b.dataset.mode === m)));
        $("#f-date", root).hidden = m !== "day";
        $("#f-month", root).hidden = m !== "month";
        $("#month-hint", root).hidden = m !== "month";
        const d = $("#f-date", root).value, mo = $("#f-month", root).value;
        if (m === "month" && !mo && d) $("#f-month", root).value = d.slice(0, 7);
        if (m === "day" && !d && mo) $("#f-date", root).value = endOfMonth(mo);
      };
      $$("[data-mode]", root).forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
      $("#f-cat", root).addEventListener("change", () => { touchedCat = true; });
      $("#f-pack", root).addEventListener("change", () => { touchedPack = true; });
      $("#f-name", root).addEventListener("change", () => {
        const p = productByName($("#f-name", root).value); if (!p) return;
        if (!touchedCat) $("#f-cat", root).value = p.category;
        if (!touchedPack) $("#f-pack", root).value = p.pack;
        if (!$("#f-brand", root).value && p.brand) $("#f-brand", root).value = p.brand;
        if (!$("#f-code", root).value && p.barcode) $("#f-code", root).value = p.barcode;
      });
      const nextBtn = $("#saveNextBtn", root);
      if (nextBtn) nextBtn.addEventListener("click", () => { scanNext = true; });
      $("#saveBtn", root).addEventListener("click", () => { scanNext = false; });

      const errEl = $("#formErr", root);
      const fail = (msg) => { errEl.textContent = msg; errEl.hidden = false; };

      $("#itemForm", root).addEventListener("submit", (e) => {
        e.preventDefault();
        errEl.hidden = true;
        const name = $("#f-name", root).value.trim();
        if (!name) return fail("Vul een productnaam in.");
        let tht;
        if (mode === "month") {
          const m = $("#f-month", root).value;
          if (!/^\d{4}-\d{2}$/.test(m)) return fail("Kies de maand en het jaar van de houdbaarheidsdatum.");
          tht = endOfMonth(m);
        } else {
          tht = $("#f-date", root).value;
          if (!isISO(tht)) return fail("Kies de houdbaarheidsdatum.");
        }
        const qty = parseInt($("#f-qty", root).value, 10);
        if (!(qty >= 1)) return fail("Het aantal moet 1 of meer zijn.");
        const data = normItem({
          id: editingId || newId(),
          name, qty, tht,
          brand: $("#f-brand", root).value.trim(),
          category: $("#f-cat", root).value,
          pack: $("#f-pack", root).value,
          monthOnly: mode === "month",
          barcode: $("#f-code", root).value,
          location: $("#f-loc", root).value.trim() || "Noodpakket",
          note: $("#f-note", root).value.trim(),
          added: v.added || todayISO(),
        });
        if (editingId) {
          const k = state.items.findIndex((i) => i.id === editingId);
          if (k >= 0) state.items[k] = data;
          toast("Opgeslagen");
        } else {
          const same = state.items.find((i) => i.name.toLowerCase() === data.name.toLowerCase() && i.tht === data.tht && i.monthOnly === data.monthOnly && i.location === data.location && i.barcode === data.barcode && i.note === data.note);
          if (same) { same.qty += qty; toast(`${data.name}: nu ${same.qty} stuks`); }
          else { state.items.push(data); toast(`${data.name} toegevoegd`); }
        }
        if (data.barcode) linkBarcode(data.barcode, data, data.id);
        commit();
        closeSheet();
        if (scanNext) scanner.open();
      });

      if (editingId) {
        $("#useBtn", root).addEventListener("click", () => {
          const it = state.items.find((i) => i.id === editingId);
          if (it) useOne(it);
          closeSheet();
        });
        const del = $("#delBtn", root); let armed = null;
        del.addEventListener("click", () => {
          if (!armed) { del.textContent = "Tik nogmaals om te verwijderen"; armed = setTimeout(() => { armed = null; del.textContent = "Verwijderen"; }, 4000); return; }
          clearTimeout(armed);
          state.items = state.items.filter((i) => i.id !== editingId);
          commit(); toast("Verwijderd"); closeSheet();
        });
      }
    });
  }

  // ---------- scan results ----------
  function handleCode(parsed) {
    const p = productFor(parsed.code);
    if (p) showKnown(parsed, p);
    else lookupAndShow(parsed);
  }

  function showKnown(parsed, p) {
    const { code } = parsed;
    const matching = sortItems(state.items.filter((i) => i.barcode === code).map(enrich));
    const n = matching.reduce((s, i) => s + i.qty, 0);
    openSheet(`
      <h2 id="sheetTitle">${esc(p.name)}</h2>
      <p class="lead">${p.brand ? esc(p.brand) + " · " : ""}<span class="code">${esc(code)}</span></p>
      <p><b>${n}</b> in voorraad</p>
      ${matching.length ? `<ul class="mini">${matching.map((i) => `<li><span>${i.qty}× · ${esc(i.location || "–")}</span><span class="code">${esc(fmtDate(i.tht, i.monthOnly))}</span></li>`).join("")}</ul>` : ""}
      <button class="btn primary" type="button" id="addMore">Nog een toevoegen</button>
      ${n ? `<button class="btn" type="button" id="usedOne">Eentje opgebruikt (oudste eerst)</button>` : ""}
      <button class="linkbtn" type="button" data-close>Sluiten</button>`, (root) => {
      $("#addMore", root).addEventListener("click", () => openForm({ name: p.name, brand: p.brand, category: p.category, pack: p.pack, barcode: code, tht: parsed.tht, monthOnly: parsed.monthOnly, location: (matching[0] && matching[0].location) || "Noodpakket" }, null, true));
      const used = $("#usedOne", root);
      if (used) used.addEventListener("click", () => {
        const target = matching.find((i) => i.qty > 0);
        const it = target && state.items.find((i) => i.id === target.id);
        if (it) useOne(it);
        closeSheet();
      });
    });
  }

  async function lookupAndShow(parsed) {
    openSheet(`<h2 id="sheetTitle">Product opzoeken…</h2><p class="lead">Barcode <span class="code">${esc(parsed.code)}</span></p>`);
    const off = await lookupOFF(parsed.code);
    if ($("#sheet").hidden) return;
    showNew(parsed, off);
  }

  function showNew(parsed, off) {
    const { code } = parsed;
    const seen = new Map();
    for (const i of sortItems(state.items)) if (!i.barcode && !seen.has(i.name.toLowerCase())) seen.set(i.name.toLowerCase(), i);
    let options = Array.from(seen.values()).map((i) => ({ item: i, score: off ? similarity(off.name, i.name) : 0 }));
    options.sort((a, b) => b.score - a.score);
    const likely = options.filter((o) => o.score >= 0.5);
    openSheet(`
      <h2 id="sheetTitle">${off ? "Nieuw product gevonden" : "Nieuwe barcode"}</h2>
      ${off ? `<div class="found"><span class="fname">${esc(off.name)}</span><span class="fmeta">${esc([off.brand, off.quantity, off.category].filter(Boolean).join(" · "))}</span><span class="fmeta code">${esc(code)}</span></div>`
            : `<p class="lead"><span class="code">${esc(code)}</span></p><p>Dit product staat niet in de productdatabase${navigator.onLine ? "" : " (je bent offline)"}. Vul de naam één keer in, dan herkent de app hem voortaan.</p>`}
      <button class="btn primary" type="button" id="newProd">${off ? "Toevoegen" : "Naam invullen en toevoegen"}</button>
      ${options.length ? `<p class="hint">${likely.length ? "Of is dit een product dat al in je lijst staat?" : "Hoort deze barcode bij een product dat al in je lijst staat? Tik het aan, dan herkent de app het voortaan."}</p>
      <div class="choices">${options.map((o, k) => `<button class="btn" type="button" data-k="${k}"><span>${esc(o.item.name)}</span>${o.score >= 0.5 ? `<span class="tag">lijkt erop</span>` : ""}</button>`).join("")}</div>` : ""}
      <button class="linkbtn" type="button" data-close>Annuleren</button>`, (root) => {
      $("#newProd", root).addEventListener("click", () => openForm(off
        ? { name: off.name, brand: off.brand, category: off.category, pack: off.pack, barcode: code, tht: parsed.tht, monthOnly: parsed.monthOnly }
        : { barcode: code, tht: parsed.tht, monthOnly: parsed.monthOnly }, null, true));
      $$("[data-k]", root).forEach((b) => b.addEventListener("click", () => {
        const i = options[Number(b.dataset.k)].item;
        linkBarcode(code, { name: i.name, brand: i.brand || (off ? off.brand : ""), category: i.category, pack: i.pack });
        commit();
        toast(`Barcode gekoppeld aan ${i.name}`);
        showKnown(parsed, state.products[code]);
      }));
    });
  }

  function showTypeCode() {
    openSheet(`
      <h2 id="sheetTitle">Barcode intikken</h2>
      <form id="codeForm" class="stack" novalidate>
        <label class="field"><span>De cijfers onder de streepjes</span><input id="f-manual" inputmode="numeric" autocomplete="off" placeholder="Bijv. 8718452…"></label>
        <button class="btn primary" type="submit">Zoeken</button>
      </form>
      <button class="linkbtn" type="button" data-close>Annuleren</button>`, (root) => {
      $("#codeForm", root).addEventListener("submit", (e) => {
        e.preventDefault();
        const v = cleanCode($("#f-manual", root).value);
        if (v) handleCode({ code: v, tht: null, monthOnly: false });
      });
    });
  }

  // ---------- live scanner ----------
  function lumaFromCanvas(ctx, w, h) {
    const d = ctx.getImageData(0, 0, w, h).data;
    const lum = new Uint8ClampedArray(w * h);
    for (let i = 0, j = 0; j < lum.length; i += 4, j++) lum[j] = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
    return lum;
  }
  function rotate90(lum, w, h) {
    const out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[x * h + (h - 1 - y)] = lum[y * w + x];
    return out;
  }
  let zxReader = null;
  function decodeLuma(lum, w, h) {
    const Z = window.ZXing; if (!Z) return null;
    if (!zxReader) {
      const F = Z.BarcodeFormat, hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE, F.DATA_MATRIX]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      zxReader = new Z.MultiFormatReader(); zxReader.setHints(hints);
    }
    try { return zxReader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, w, h)))).getText(); }
    catch (e) { return null; }
  }
  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = beep.ac || (beep.ac = new AC());
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 1320; g.gain.value = 0.08;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.09);
    } catch (e) { /* geen geluid, geen probleem */ }
    if (navigator.vibrate) navigator.vibrate(60);
  }

  const scanner = {
    stream: null, running: false, timer: null, detector: null, frame: 0, torch: false,
    canvas: document.createElement("canvas"),
    async open() {
      closeSheet();
      const el = $("#scanner"), video = $("#video"), msg = $("#scanMsg");
      el.hidden = false; el.classList.remove("hit");
      msg.hidden = true; $("#guide").hidden = false; $("#scanTop").hidden = false;
      $("#torchBtn").hidden = true; $("#torchBtn").setAttribute("aria-pressed", "false"); this.torch = false;
      // a sound must be unlocked from the tap that opened the scanner (iOS)
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { beep.ac = beep.ac || new AC(); beep.ac.resume && beep.ac.resume(); } } catch (e) {}
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return this.fail("Deze browser geeft geen toegang tot de camera. Open de app via het https-adres in Safari of Chrome, of tik op Cijfers intikken.");
      }
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      } catch (e) {
        return this.fail(e && e.name === "NotAllowedError"
          ? "De app mag de camera niet gebruiken. Sta de camera toe in de instellingen van je browser (bij Safari: aA-knop links in de adresbalk → Website-instellingen → Camera)."
          : "De camera kon niet starten. Sluit andere apps die de camera gebruiken en probeer het opnieuw.");
      }
      if (el.hidden) { this.stop(); return; }
      video.srcObject = this.stream;
      try { await video.play(); } catch (e) { /* autoplay is muted+inline, so normally fine */ }
      const track = this.stream.getVideoTracks()[0];
      const caps = (track && track.getCapabilities) ? track.getCapabilities() : {};
      if (caps.torch) $("#torchBtn").hidden = false;
      if (caps.focusMode && caps.focusMode.includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
      this.detector = null;
      if ("BarcodeDetector" in window) {
        try {
          const supported = await window.BarcodeDetector.getSupportedFormats();
          const want = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "qr_code", "data_matrix"].filter((f) => supported.includes(f));
          if (want.includes("ean_13")) this.detector = new window.BarcodeDetector({ formats: want });
        } catch (e) { this.detector = null; }
      }
      if (!this.detector && !window.ZXing) return this.fail("De scanner kon niet laden. Controleer je internetverbinding en probeer het opnieuw.");
      this.running = true; this.frame = 0;
      this.loop();
    },
    fail(text) {
      this.stop();
      $("#guide").hidden = true; $("#scanTop").hidden = true;
      const msg = $("#scanMsg"); msg.textContent = text; msg.hidden = false;
    },
    async loop() {
      if (!this.running) return;
      let raw = null;
      try { raw = await this.scanFrame(); } catch (e) { raw = null; }
      if (!this.running) return;
      if (raw) return this.found(raw);
      this.timer = setTimeout(() => this.loop(), this.detector ? 60 : 110);
    },
    async scanFrame() {
      const video = $("#video");
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh || video.readyState < 2) return null;
      if (this.detector) {
        const res = await this.detector.detect(video);
        return res && res.length ? res[0].rawValue : null;
      }
      this.frame++;
      const c = this.canvas, ctx = c.getContext("2d", { willReadFrequently: true });
      if (this.frame % 4 === 0) {
        // af en toe het hele beeld, gedraaid: voor barcodes die verticaal op het blik staan
        const s = Math.min(1, 900 / Math.max(vw, vh));
        const w = Math.round(vw * s), h = Math.round(vh * s);
        c.width = w; c.height = h; ctx.drawImage(video, 0, 0, w, h);
        const lum = lumaFromCanvas(ctx, w, h);
        return decodeLuma(rotate90(lum, w, h), h, w) || decodeLuma(lum, w, h);
      }
      const sw = Math.round(vw * 0.86), sh = Math.round(vh * 0.42);
      const sx = Math.round((vw - sw) / 2), sy = Math.round((vh - sh) / 2 - vh * 0.03);
      const s = Math.min(1, 1100 / sw);
      const w = Math.round(sw * s), h = Math.round(sh * s);
      c.width = w; c.height = h;
      ctx.drawImage(video, sx, Math.max(0, sy), sw, sh, 0, 0, w, h);
      return decodeLuma(lumaFromCanvas(ctx, w, h), w, h);
    },
    found(raw) {
      $("#scanner").classList.add("hit");
      beep();
      this.stop();
      setTimeout(() => { $("#scanner").hidden = true; handleCode(parseCode(raw)); }, 180);
    },
    async toggleTorch() {
      const track = this.stream && this.stream.getVideoTracks()[0]; if (!track) return;
      this.torch = !this.torch;
      try { await track.applyConstraints({ advanced: [{ torch: this.torch }] }); $("#torchBtn").setAttribute("aria-pressed", String(this.torch)); }
      catch (e) { this.torch = false; $("#torchBtn").hidden = true; }
    },
    stop() {
      this.running = false; clearTimeout(this.timer);
      if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
      const v = $("#video"); if (v) v.srcObject = null;
    },
    close() { this.stop(); $("#scanner").hidden = true; },
  };
  $("#scanBtn").addEventListener("click", () => scanner.open());
  $("#closeScanBtn").addEventListener("click", () => scanner.close());
  $("#torchBtn").addEventListener("click", () => scanner.toggleTorch());
  $("#typeCodeBtn").addEventListener("click", () => { scanner.close(); showTypeCode(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && scanner.running) scanner.close(); });

  // ---------- files: Excel, backup, restore ----------
  async function offerFile(blob, filename) {
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
    } catch (e) { if (e && e.name === "AbortError") return false; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  }
  let xlsxLoading = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve();
    if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => res(); s.onerror = () => { xlsxLoading = null; rej(new Error("load")); };
      document.head.appendChild(s);
    });
    return xlsxLoading;
  }
  const stamp = () => todayISO().split("-").reverse().join("-");
  async function exportExcel() {
    try {
      await loadXLSX();
      const X = window.XLSX;
      const rows = [["Product", "Merk", "Categorie", "Verpakking", "Aantal", "Houdbaar tot", "Dagen over", "Status", "Locatie", "Barcode", "Opmerking"]];
      for (const i of sortItems(state.items.map(enrich))) {
        let dt = null;
        if (i.tht) { const [y, m, d] = i.tht.split("-").map(Number); dt = new Date(y, m - 1, d); }
        rows.push([i.name, i.brand, i.category, i.pack, i.qty, dt, i.days, ST_LABEL[i.st], i.location, i.barcode, i.note]);
      }
      const ws = X.utils.aoa_to_sheet(rows, { cellDates: true });
      for (let r = 1; r < rows.length; r++) { const c = ws[X.utils.encode_cell({ r, c: 5 })]; if (c && c.t === "d") c.z = "dd-mm-yyyy"; }
      ws["!cols"] = [{ wch: 34 }, { wch: 12 }, { wch: 14 }, { wch: 11 }, { wch: 8 }, { wch: 13 }, { wch: 11 }, { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 40 }];
      const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Voorraad");
      const buf = X.write(wb, { bookType: "xlsx", type: "array", cellDates: true });
      await offerFile(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `Noodpakket voorraad ${stamp()}.xlsx`);
    } catch (e) { toast("Exporteren lukte niet. Controleer je internetverbinding."); }
  }
  async function makeBackup() {
    const blob = new Blob([JSON.stringify({ app: "noodpakket", version: 1, saved: todayISO(), ...state }, null, 2)], { type: "application/json" });
    const ok = await offerFile(blob, `Noodpakket back-up ${stamp()}.json`);
    if (ok) toast("Back-up gemaakt");
  }
  $("#restoreInput").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    let incoming = null;
    try { const j = JSON.parse(await file.text()); if (j && Array.isArray(j.items)) incoming = normState(j); } catch (err) { incoming = null; }
    if (!incoming) { openSheet(`<h2 id="sheetTitle">Dit is geen back-up</h2><p class="lead">Kies een bestand dat je eerder via <i>Back-up maken</i> hebt opgeslagen.</p><button class="btn" type="button" data-close>Sluiten</button>`); return; }
    const n = (s) => s.items.reduce((a, i) => a + i.qty, 0);
    openSheet(`
      <h2 id="sheetTitle">Back-up terugzetten?</h2>
      <p>Je huidige lijst (${n(state)} producten) wordt vervangen door de back-up (${n(incoming)} producten).</p>
      <button class="btn primary" type="button" id="doRestore">Vervangen</button>
      <button class="linkbtn" type="button" data-close>Annuleren</button>`, (root) => {
      $("#doRestore", root).addEventListener("click", () => { state = incoming; commit(); closeSheet(); toast("Back-up teruggezet"); });
    });
  });
  function showMenu() {
    openSheet(`
      <h2 id="sheetTitle">Meer</h2>
      <div class="menu">
        <button class="btn" type="button" id="m-excel">Exporteer naar Excel</button>
        <button class="btn" type="button" id="m-backup">Back-up maken</button>
        <button class="btn" type="button" id="m-restore">Back-up terugzetten</button>
      </div>
      <p class="hint">Je lijst staat alleen op dit apparaat, in deze browser. Maak af en toe een back-up, bijvoorbeeld bij de halfjaarlijkse controle. Productnamen komen uit Open Food Facts, een open productdatabase.</p>
      <button class="linkbtn" type="button" data-close>Sluiten</button>`, (root) => {
      $("#m-excel", root).addEventListener("click", () => { closeSheet(); exportExcel(); });
      $("#m-backup", root).addEventListener("click", () => { closeSheet(); makeBackup(); });
      $("#m-restore", root).addEventListener("click", () => { closeSheet(); $("#restoreInput").click(); });
    });
  }

  // ---------- other UI ----------
  $("#menuBtn").addEventListener("click", showMenu);
  $("#tiles").addEventListener("click", (e) => { const t = e.target.closest(".tile"); if (!t) return; filter = filter === t.dataset.st ? null : t.dataset.st; render(); });
  $("#filterChip").addEventListener("click", () => { filter = null; render(); });
  $("#search").addEventListener("input", (e) => { query = e.target.value; render(); });
  $("#list").addEventListener("click", (e) => {
    const b = e.target.closest(".row"); if (!b) return;
    const it = state.items.find((i) => i.id === b.dataset.id); if (it) openForm(it, it.id, false);
  });
  $("#manualBtn").addEventListener("click", () => openForm({}, null, false));
  $("#checkBtn").addEventListener("click", () => { state.meta.lastCheck = todayISO(); commit(); toast("Controle vastgelegd"); });
  window.addEventListener("storage", (e) => { if (e.key === STORE_KEY) { load(); render(); } });

  // for tests
  window.__noodpakket = { parseCode, parseOFF, mapCategory, mapPack, similarity, endOfMonth, statusOf, daysText };

  load();
  render();
})();
</script>
</body>
</html>
